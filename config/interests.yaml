# 関心の定義。タイトルとタグにキーワードが含まれると「あなた向け」に入る。
# weight: 0〜1。同じ人気度なら weight が高いトピックが上に来る。
# 英数字のキーワードは単語単位で照合する(例: "go" は "google" に当たらない)。
# 日本語のキーワードは部分一致。大文字小文字は区別しない。

topics:
  neovim:
    weight: 1.0
    keywords: [neovim, nvim, vim, lua, lazy.nvim, treesitter, tree-sitter]
  typescript:
    weight: 0.9
    keywords: [typescript, ts, deno, bun, tsgo]
  node:
    weight: 0.9
    keywords: [node.js, nodejs, node, npm, pnpm, v8]
  testing:
    weight: 1.0
    keywords: [playwright, e2e, end-to-end, appium, webdriver, testing, テスト, 自動テスト]
  ai-agent:
    weight: 0.9
    keywords: [claude, claude code, agent, agents, ai agent, mcp, llm, codex, エージェント, 生成ai]
  engineering-management:
    weight: 0.7
    keywords: [engineering manager, engineering management, 1on1, 1on1s, マネジメント, エンジニアリングマネージャー, 組織, チームビルディング, 開発生産性, dora]

# 見たくない話題。タイトル・タグ・ドメインのいずれかに当たると除外する。
mute:
  keywords: [web3, crypto, nft, 求人, 採用情報, ポエム]
  domains: []
