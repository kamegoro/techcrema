# Copy this file to .github/workflows/techcrema.yml in your repository,
# then set Settings → Pages → Source to "GitHub Actions" and run it once from the Actions tab.
name: TechCrema

on:
  schedule:
    - cron: '0 6 * * *' # every day at 06:00 UTC — change to suit your morning
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.techcrema.outputs.page_url }}
    steps:
      - id: techcrema
        uses: kamegoro/techcrema@v1
        with:
          language: en
          topics: |
            Rust: [rust, cargo]
            Databases: [postgres, sqlite, duckdb]
            AI: { weight: 0.8, keywords: [llm, agents, mcp] }
          official: |
            https://blog.rust-lang.org/feed.xml
            rust-lang/rust
          mute-keywords: crypto, nft
