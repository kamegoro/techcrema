name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read access is all these jobs need
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  e2e:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # WebKit on Linux is several times slower per test, so the iPhone project runs in two shards
        include:
          - { project: iphone, browser: webkit, shard: 1/2 }
          - { project: iphone, browser: webkit, shard: 2/2 }
          - { project: android, browser: chromium, shard: 1/1 }
          - { project: desktop, browser: chromium, shard: 1/1 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps ${{ matrix.browser }}
        if: steps.browsers.outputs.cache-hit == 'true'
      - run: npm run e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        env:
          # Traces are written to the temp dir; keep them on disk rather than in a small tmpfs /tmp
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: playwright-report
          retention-days: 7
