<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- GitHub Pages cannot set response headers, so the CSP lives in a meta tag -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'"
    />
    <meta name="referrer" content="no-referrer" />
    <!-- A personal page: keep it out of search engines -->
    <meta name="robots" content="noindex, nofollow" />
    <title>TechCrema</title>
    <meta name="description" content="Trending tech stories that match your interests, on one page a day" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./theme-init.js"></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <h1 class="brand-title">TechCrema</h1>
          <p class="brand-meta" id="meta" aria-live="polite"></p>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="theme" type="button" aria-pressed="false" data-i18n-label="theme.toggle" aria-label="Dark mode" title="Dark mode">
            <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2m-7.07-17.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></svg>
            <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>
          </button>
        </div>
      </div>
      <nav class="tabs" aria-label="Views" data-i18n-aria="tabs">
        <a class="tab" href="#today" data-tab="today" data-i18n="tab.today">Today<span class="tab-count" id="count-today"></span></a>
        <a class="tab" href="#later" data-tab="later" data-i18n="tab.later">Later<span class="tab-count" id="count-later"></span></a>
        <a class="tab" href="#settings" data-tab="settings" data-i18n="tab.mute">Muted<span class="tab-count" id="count-mute"></span></a>
      </nav>
    </header>
    <!-- Only the section list stays on screen while scrolling; the title and tabs scroll away -->
    <div class="section-bar">
      <nav class="section-nav" id="section-nav" aria-label="Sections" data-i18n-aria="sections"></nav>
    </div>

    <main id="main" class="content" tabindex="-1"></main>

    <dialog class="sheet" id="mute-sheet" aria-labelledby="mute-title">
      <form method="dialog" class="sheet-body" id="mute-form">
        <h2 class="sheet-title" id="mute-title" data-i18n="mute.title">What do you want to mute?</h2>
        <p class="sheet-subtitle" id="mute-story"></p>
        <fieldset class="mute-options" id="mute-options"></fieldset>
        <label class="field">
          <span class="field-label" data-i18n="mute.custom">Add keywords</span>
          <input class="field-input" id="mute-custom" type="text" placeholder="e.g. Rust, LLM" data-i18n-placeholder="mute.placeholder" autocomplete="off" />
        </label>
        <div class="sheet-actions">
          <button class="button" value="cancel" type="submit" formnovalidate data-i18n="mute.cancel">Cancel</button>
          <button class="button button-primary" value="mute" type="submit" id="mute-submit" data-i18n="mute.submit">Mute</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span class="toast-text" id="toast-text"></span>
      <button class="toast-action" id="toast-action" type="button" hidden></button>
    </div>
  </body>
</html>
