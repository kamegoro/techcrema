name: Bug report
description: Something on the page or in the action doesn't work
labels:
  - bug
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before reporting
      options:
        - label: I have read the README
          required: true
        - label: I have searched existing issues
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Your workflow step or tech-catchup.yml
      description: Remove anything you consider private.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Action log or browser console output
      render: text

  - type: input
    id: environment
    attributes:
      label: Browser / device (for page issues)
      placeholder: e.g. Safari on iOS 26, Chrome 142 on Android
