# This repository's own page, built with the action in this repository (uses: ./).
# To make your own page, copy examples/workflow.yml instead — see README.md.
name: Update feed

on:
  schedule:
    - cron: '0 21 * * *' # 06:00 JST
    - cron: '0 8 * * *' # 17:00 JST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never collect twice at the same time (that would double the requests to every source)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.techcrema.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: techcrema
        uses: ./
        with:
          qiita-token: ${{ secrets.QIITA_TOKEN }}
