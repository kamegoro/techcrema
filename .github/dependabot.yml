version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Updates merge automatically once CI passes, so skip releases younger than a few days
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      dev-dependencies:
        dependency-type: development
